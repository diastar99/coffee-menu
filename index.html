<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 메뉴판</title>
    <style>
        :root {
            --primary: #4a3728;
            --primary-light: #6b5340;
            --accent: #d97706;
            --bg-color: #f8f5f0;
            --card-bg: #ffffff;
            --border-color: #e5e0db;
            --text-main: #33271d;
            --text-sub: #786452;
            --success: #16a34a;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body.admin-body {
            overflow: auto;
            background: #f0ebe4;
            padding: 40px 20px;
        }
        /* [v-cloak] { display: none; } 제거 - 로딩 중 하얀 화면 방지 */
        #app { min-height: 100vh; position: relative; }

        /* 배경 이미지 레이어 */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
            background-color: #f8f5f0;
            pointer-events: none;
        }

        /* 디스플레이 화면 레이아웃 */
        .page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .content-wrapper {
            margin-top: 35vh;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
            z-index: 10;
        }

        .category { flex: 1; text-align: center; }
        .cat-title {
            font-size: 22px;
            font-weight: 700;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 15px;
            padding-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .menu-item { margin: 8px 0; }
        .item-name { font-size: 16px; font-weight: 600; }
        .item-eng { font-size: 10px; opacity: 0.75; text-transform: uppercase; font-weight: 500; letter-spacing: 0.5px; }

        /* 스티커 스타일 */
        .sticker-wrapper {
            position: absolute;
            cursor: grab;
            user-select: none;
            touch-action: none;
            z-index: 40;
            border: 2px dashed transparent;
            border-radius: 12px;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }
        .sticker-wrapper:hover,
        .sticker-wrapper.is-active {
            border-color: rgba(217, 119, 6, 0.7);
            background: rgba(255, 255, 255, 0.12);
        }
        .sticker-wrapper:active { cursor: grabbing; }
        .sticker {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }

        .resize-handle {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 26px;
            height: 26px;
            background: var(--accent);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: nwse-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            touch-action: none;
        }
        .sticker-wrapper:hover .resize-handle,
        .sticker-wrapper.is-active .resize-handle {
            opacity: 1;
            transform: scale(1.05);
        }

        /* 하단 우측 컨트롤 핫스팟 영역 */
        .control-hotspots {
            position: absolute;
            bottom: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 9999 !important;
            pointer-events: auto;
        }
        .hotspot-btn {
            background: rgba(255, 255, 255, 0.05); /* 버튼이 확실히 보이게 잠시 배경색 부여 */
            color: rgba(255, 255, 255, 0.5); /* 텍스트도 잠시 보이게 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            width: auto;
            height: auto;
            cursor: pointer;
            z-index: 10000 !important;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            pointer-events: auto !important;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .hotspot-btn:hover {
            background: rgba(255,255,255,0.05);
        }

        /* 동기화 상태 배지 */
        .sync-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 100;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .sync-on { color: var(--success); }
        .sync-off { color: var(--text-sub); }

        /* ── 모던 관리자 페이지 및 모달 공통 UI 스타일 ── */
        .dashboard-container {
            max-width: 840px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(74, 55, 40, 0.08);
            padding: 32px;
        }
        .dashboard-container.simple-admin-mode {
            max-width: 500px; /* Smaller max-width for phone-like experience */
            padding: 20px; /* Reduced padding */
            margin-top: 20px; /* Adjust margin for mobile view */
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .dash-header h2 {
            margin: 0;
            font-size: 24px;
            color: var(--primary);
        }
        .dash-actions {
            display: flex;
            gap: 10px;
        }

        .card-section {
            background: #faf8f5;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .form-row label {
            width: 110px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-sub);
        }
        .form-input, input[type="text"], input[type="url"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, input[type="text"]:focus, input[type="url"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        .file-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .file-label {
            background: #e8e2dc;
            color: var(--primary);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .file-label:hover { background: #dcd4cc; }
        .file-label input { display: none; }

        /* 버튼 스타일 */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-accent { background: var(--accent); }
        .btn-accent:hover { background: #b45309; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background: #eee5dc; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

        /* 카테고리별 아코디언/탭 메뉴 관리 UI */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .menu-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .menu-edit-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .menu-edit-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .menu-edit-row input[type="text"] {
            flex: 1;
            padding: 6px 10px;
            font-size: 13px;
        }

        /* 화면 내 빠른 메뉴 관리 모달 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-card {
            background: #fff;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease-out;
        }
        .modal-header {
            padding: 20px 24px;
            background: var(--primary);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .modal-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .modal-close:hover { background: rgba(255,255,255,0.2); }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            background: #f8f5f0;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .hint { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
    </style>
</head>
<body :class="{ 'admin-body': mode === 'admin' || mode === 'simple-admin' }">
    <div id="app" v-cloak>
        <!-- ================= 디스플레이 모드 ================= -->
        <div v-if="mode === 'display'" class="page">
            <img v-if="config.bgImage" :src="config.bgImage" class="bg-layer" style="z-index: -1;">

            <!-- 동기화 상태 (DB URL이 설정되어 있을 때만 표시) -->
            <div v-if="syncConfig.dbUrl" class="sync-badge" :class="syncStatus.connected ? 'sync-on' : 'sync-off'">
                {{ syncStatus.connected ? '● 실시간 동기화 중' : '○ 동기화 연결 대기' }}
            </div>

            <div v-if="config.stickerImage"
                 class="sticker-wrapper"
                 :class="{ 'is-active': isManipulating }"
                 :style="stickerStyle"
                 @pointerdown="startDrag">
                <img :src="config.stickerImage" class="sticker" draggable="false">
                <div class="resize-handle" @pointerdown.stop="startResize" title="드래그하여 크기 조절">↘</div>
            </div>

            <div class="content-wrapper">
                <div v-for="cat in config.categories" :key="cat.name" class="category">
                    <h2 class="cat-title">{{ cat.name }}</h2>
                    <template v-for="item in cat.items" :key="item.name">
                        <div class="menu-item" v-if="item.enabled !== false">
                            <div class="item-name">{{ item.name }}</div>
                            <div class="item-eng">{{ item.engName }}</div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="control-hotspots" style="background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px; bottom: 20px; right: 20px;">
                <button class="btn btn-outline" @click="console.log('Click: 빠른 편집'); openQuickModal()">📋 빠른 편집</button>
                <button class="btn btn-outline" @click="console.log('Click: 관리 설정'); setMode('admin')">⚙️ 관리 설정</button>
            </div>
        </div>

        <!-- ================= 모던 관리자 페이지 모드 ================= -->
        <div v-if="mode === 'admin'" class="dashboard-container">
            <div class="dash-header">
                <h2>☕ 메뉴판 관리</h2>
                <div class="dash-actions">
                    <button class="btn btn-accent" @click="saveDataOnly(true)">저장</button>
                    <button class="btn btn-outline" @click="setMode('display')">닫기</button>
                </div>
            </div>

            <div class="card-section">
                <h3>클라우드 동기화 (Firebase RTDB)</h3>
                <div class="form-row">
                    <label>DB URL</label>
                    <input type="url" v-model="syncConfig.dbUrl" placeholder="https://your-project.firebaseio.com">
                </div>
                <div class="form-row">
                    <label>방 ID (Room ID)</label>
                    <input type="text" v-model="syncConfig.roomId" placeholder="default">
                </div>
                <div class="hint">다른 기기에서 동일한 DB URL과 방 ID를 입력하면 실시간으로 동기화됩니다.</div>
                <div style="margin-top:10px;">
                    <button class="btn btn-sm btn-outline" @click="copyShareLink">공유 링크 복사</button>
                </div>
            </div>

            <!-- 이미지 설정 -->
            <div class="card-section">
                <h3>이미지 설정</h3>
                <div class="form-row">
                    <label>배경 이미지</label>
                    <div class="file-upload-box">
                        <label class="file-label">
                            파일 선택
                            <input type="file" accept="image/*" @change="handleFileChange($event, 'bgImage')">
                        </label>
                        <button v-if="config.bgImage" class="btn btn-sm btn-outline btn-danger" @click="clearImage('bgImage')">삭제</button>
                    </div>
                </div>
                <div v-if="config.bgImage" class="form-row" style="margin-top: -8px; margin-bottom: 20px;">
                    <label></label> <!-- Label placeholder for alignment -->
                    <img :src="config.bgImage" style="max-width: 100%; height: 100px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-color);">
                </div>

                <div class="form-row">
                    <label>스티커 이미지</label>
                    <div class="file-upload-box">
                        <label class="file-label">
                            파일 선택
                            <input type="file" accept="image/*" @change="handleFileChange($event, 'stickerImage')">
                        </label>
                        <button v-if="config.stickerImage" class="btn btn-sm btn-outline btn-danger" @click="clearImage('stickerImage')">삭제</button>
                    </div>
                </div>
                <div v-if="config.stickerImage" class="form-row" style="margin-top: -8px; margin-bottom: 20px;">
                    <label></label> <!-- Label placeholder for alignment -->
                    <img :src="config.stickerImage" style="max-width: 100%; height: 100px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-color);">
                </div>

                <div class="form-row">
                    <label>스티커 크기</label>
                    <input type="range" v-model.number="config.stickerSize" :min="MIN_STICKER_SIZE" :max="MAX_STICKER_SIZE" class="form-input" style="flex: 1;">
                    <span style="width: 50px; text-align: right; font-weight: 600;">{{ config.stickerSize }}px</span>
                </div>
            </div>

            <!-- 메뉴 관리 UI (기존 유지) -->
            <div class="card-section">
                <h3>메뉴 관리</h3>
                <!-- 카테고리 탭 및 메뉴 리스트 -->
                <div class="category-tabs">
                    <button v-for="(cat, idx) in config.categories" :key="idx"
                            class="tab-btn" :class="{ active: activeTab === idx }" @click="activeTab = idx">
                        {{ cat.name }}
                    </button>
                </div>
                <div class="menu-list-container">
                    <div v-for="(item, iIdx) in config.categories[activeTab]?.items" :key="iIdx" class="menu-edit-row">
                        <input type="checkbox" v-model="item.enabled">
                        <input type="text" v-model="item.name" placeholder="한글명">
                        <input type="text" v-model="item.engName" placeholder="영문명">
                        <button class="btn btn-sm btn-outline btn-danger" @click="removeItem(activeTab, iIdx)">×</button>
                    </div>
                </div>
                <div style="margin-top: 15px; text-align: center;">
                    <button class="btn btn-sm btn-outline" @click="addItem(activeTab)">+ 메뉴 추가</button>
                </div>
            </div>
        </div>

        <!-- ================= 폰 전용 간편 관리 화면 ================= -->
        <div v-if="mode === 'simple-admin'" class="dashboard-container simple-admin-mode">
            <div class="dash-header">
                <h2>📱 간편 메뉴 관리</h2>
                <div class="dash-actions">
                    <button class="btn btn-accent" @click="saveDataOnly(true)">저장</button>
                    <button class="btn btn-outline" @click="setMode('display')">닫기</button>
                </div>
            </div>

            <div class="card-section">
                <h3>메뉴 관리</h3>
                <div class="category-tabs">
                    <button v-for="(cat, idx) in config.categories" :key="idx"
                            class="tab-btn" :class="{ active: activeTab === idx }" @click="activeTab = idx">
                        {{ cat.name }}
                    </button>
                </div>
                <div class="menu-list-container">
                    <div v-for="(item, iIdx) in config.categories[activeTab]?.items" :key="iIdx" class="menu-edit-row">
                        <input type="checkbox" v-model="item.enabled">
                        <input type="text" v-model="item.name" placeholder="한글명">
                        <input type="text" v-model="item.engName" placeholder="영문명">
                        <button class="btn btn-sm btn-outline btn-danger" @click="removeItem(activeTab, iIdx)">×</button>
                    </div>
                </div>
                <div style="margin-top: 15px; text-align: center;">
                    <button class="btn btn-sm btn-outline" @click="addItem(activeTab)">+ 메뉴 추가</button>
                </div>
            </div>
        </div>

        <!-- ================= 빠른 메뉴 편집 모달 ================= -->
        <div v-if="showQuickModal" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>빠른 메뉴 편집</h3>
                    <button class="modal-close" @click="closeQuickModal">×</button>
                </div>
                <div class="modal-body">
                    <!-- 모달 본문 (관리자 페이지 메뉴 UI 재활용) -->
                    <div class="category-tabs">
                        <button v-for="(cat, idx) in config.categories" :key="idx"
                                class="tab-btn" :class="{ active: activeTab === idx }" @click="activeTab = idx">
                            {{ cat.name }}
                        </button>
                    </div>
                    <div class="menu-list-container">
                        <div v-for="(item, iIdx) in config.categories[activeTab]?.items" :key="iIdx" class="menu-edit-row">
                            <input type="checkbox" v-model="item.enabled">
                            <input type="text" v-model="item.name" placeholder="한글명">
                            <input type="text" v-model="item.engName" placeholder="영문명">
                            <button class="btn btn-sm btn-outline btn-danger" @click="removeItem(activeTab, iIdx)">×</button>
                        </div>
                    </div>
                    <div style="margin-top: 15px; text-align: center;">
                        <button class="btn btn-sm btn-outline" @click="addItem(activeTab)">+ 메뉴 추가</button>
                    </div>
                </div>
                <div class="modal-footer" style="justify-content: space-between;">
                    <button class="btn btn-sm btn-outline" @click="setMode('simple-admin'); closeQuickModal();">📱 간편 관리 화면</button>
                    <button class="btn btn-accent" @click="closeQuickModal">확인 (저장)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const MIN_STICKER_SIZE = 80;
        const MAX_STICKER_SIZE = 350;

        const INITIAL_DATA = {
            title: 'BRAVO COFFEE', bgImage: '', stickerImage: '',
            stickerPos: { top: 4, left: 66, unit: '%' }, stickerSize: 160,
            categories: [
                { name: '커피', items: [{name:'아메리카노', engName:'AMERICANO', enabled:true}, {name:'카페라떼', engName:'CAFFE LATTE', enabled:true}, {name:'바닐라라떼', engName:'VANILLA LATTE', enabled:true}, {name:'헤이즐넛라떼', engName:'HAZELNUT LATTE', enabled:true}] },
                { name: '논커피', items: [{name:'녹차우유', engName:'GREEN TEA MILK', enabled:true}, {name:'초코우유', engName:'CHOCOLATE MILK', enabled:true}, {name:'헤이즐넛우유', engName:'HAZELNUT MILK', enabled:true}] },
                { name: '에이드', items: [{name:'오렌지 에이드', engName:'ORANGE ADE', enabled:true}, {name:'자몽 에이드', engName:'GRAPEFRUIT ADE', enabled:true}, {name:'레몬 에이드', engName:'LEMON ADE', enabled:true}] },
                { name: '티', items: [{name:'아이스티', engName:'ICED TEA', enabled:true}, {name:'자몽차', engName:'GRAPEFRUIT TEA', enabled:true}, {name:'유자차', engName:'CITRON TEA', enabled:true}, {name:'캐모마일', engName:'CHAMOMILE', enabled:true}, {name:'페퍼민트', engName:'PEPPERMINT', enabled:true}] },
                { name: '블랜디드티', items: [{name:'얼그레이', engName:'EARL GREY', enabled:true}, {name:'레몬라임', engName:'LEMON LIME', enabled:true}, {name:'살구썬라이즈', engName:'APRICOT SUNRISE', enabled:true}, {name:'히비스커스', engName:'HIBISCUS', enabled:true}] }
            ]
        };

        const clampSize = (val) => {
            const num = Number(val);
            if (isNaN(num)) return INITIAL_DATA.stickerSize;
            return Math.round(Math.min(MAX_STICKER_SIZE, Math.max(MIN_STICKER_SIZE, num)));
        };

        const clampPercent = (val, max = 92) => {
            const num = Number(val);
            if (isNaN(num)) return 0;
            return Math.min(max, Math.max(0, num));
        };

        const normalizeConfig = (raw) => {
            const merged = raw ? { ...INITIAL_DATA, ...raw } : JSON.parse(JSON.stringify(INITIAL_DATA));
            let pos = merged.stickerPos || { ...INITIAL_DATA.stickerPos };
            if (pos.unit !== '%') {
                pos = {
                    top: clampPercent((Number(pos.top) / Math.max(window.innerHeight, 600)) * 100, 85),
                    left: clampPercent(pos.left > 800 ? 66 : (Number(pos.left) / Math.max(window.innerWidth, 800)) * 100, 88),
                    unit: '%'
                };
            }
            merged.stickerPos = pos;
            merged.stickerSize = clampSize(merged.stickerSize);
            return merged;
        };

        const compressImage = (dataURL, maxWidth, maxHeight, quality = 0.7, mimeType) => {
            return new Promise((resolve, reject) => {
                // For GIF, skip compression to preserve animation
                if (mimeType === 'image/gif') {
                    resolve(dataURL);
                    return;
                }

                const img = new Image();
                img.src = dataURL;
                img.onload = () => {
                    const offscreenCanvas = document.createElement('canvas'); // Use regular canvas if OffscreenCanvas not supported
                    const ctx = offscreenCanvas.getContext('2d');

                    let width = img.width;
                    let height = img.height;

                    // Calculate new dimensions to fit within maxWidth/maxHeight while maintaining aspect ratio
                    if (width > maxWidth || height > maxHeight) {
                        const aspectRatio = width / height;
                        if (width > height) { // Landscape
                            width = maxWidth;
                            height = width / aspectRatio;
                        } else { // Portrait or square
                            height = maxHeight;
                            width = height * aspectRatio;
                        }
                    }

                    offscreenCanvas.width = width;
                    offscreenCanvas.height = height;

                    ctx.drawImage(img, 0, 0, width, height);

                    const outputMimeType = mimeType === 'image/png' ? 'image/png' : 'image/jpeg';
                    offscreenCanvas.toBlob(blob => {
                        if (!blob) {
                            reject(new Error('Canvas toBlob failed.'));
                            return;
                        }
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    }, outputMimeType, quality);
                };
                img.onerror = (error) => reject(error);
            });
        };

        const { createApp, ref, computed, watch, onMounted } = Vue;
        createApp({
            setup() {
                const mode = ref(localStorage.getItem('menu_mode') || 'display');
                let savedData = null;
                try {
                    savedData = JSON.parse(localStorage.getItem('menu_data'));
                } catch(e) {}

                const config = ref(normalizeConfig(savedData));
                const isManipulating = ref(false);
                const activeTab = ref(0);
                const showQuickModal = ref(false);
                const syncStatus = ref({ connected: false });
                const syncConfig = ref(JSON.parse(localStorage.getItem('menu_sync_config') || '{"dbUrl":"", "roomId":"default"}'));

                const syncBodyScroll = (m) => {
                    document.body.classList.toggle('admin-body', m === 'admin' || m === 'simple-admin');
                };
                syncBodyScroll(mode.value);
                watch(mode, syncBodyScroll);

                // Watch syncConfig for changes and save to localStorage immediately
                watch(syncConfig, (newVal) => {
                    localStorage.setItem('menu_sync_config', JSON.stringify(newVal));
                }, { deep: true });

                const stickerStyle = computed(() => {
                    const size = clampSize(config.value.stickerSize);
                    const top = clampPercent(config.value.stickerPos?.top ?? 4, 88);
                    const left = clampPercent(config.value.stickerPos?.left ?? 66, 90);
                    return {
                        top: top + '%',
                        left: left + '%',
                        width: size + 'px',
                        height: size + 'px'
                    };
                });

                // Sticker drag & resize functionality
                let initialPointerX = 0;
                let initialPointerY = 0;
                let initialStickerLeft = 0;
                let initialStickerTop = 0;
                let initialStickerSize = 0;

                const getStickerElement = () => document.querySelector('.sticker-wrapper');

                const startDrag = (e) => {
                    if (mode.value !== 'display') return; // Only allow drag in display mode
                    isManipulating.value = true;
                    const stickerEl = getStickerElement();
                    if (!stickerEl) return;

                    initialPointerX = e.clientX;
                    initialPointerY = e.clientY;

                    // Get current sticker position in pixels
                    const rect = stickerEl.getBoundingClientRect();
                    initialStickerLeft = rect.left;
                    initialStickerTop = rect.top;

                    window.addEventListener('pointermove', doDrag);
                    window.addEventListener('pointerup', stopDrag);
                };

                const doDrag = (e) => {
                    if (!isManipulating.value) return;

                    const dx = e.clientX - initialPointerX;
                    const dy = e.clientY - initialPointerY;

                    const stickerEl = getStickerElement();
                    if (!stickerEl) return;

                    const parentRect = stickerEl.parentElement.getBoundingClientRect();
                    const newLeftPx = initialStickerLeft + dx;
                    const newTopPx = initialStickerTop + dy;

                    const newLeftPercent = clampPercent(((newLeftPx / parentRect.width) * 100), 90);
                    const newTopPercent = clampPercent(((newTopPx / parentRect.height) * 100), 88);

                    config.value.stickerPos = { left: newLeftPercent, top: newTopPercent, unit: '%' };
                };

                const stopDrag = () => {
                    isManipulating.value = false;
                    window.removeEventListener('pointermove', doDrag);
                    window.removeEventListener('pointerup', stopDrag);
                    saveDataOnly();
                };

                const startResize = (e) => {
                    if (mode.value !== 'display') return; // Only allow resize in display mode
                    isManipulating.value = true;
                    initialPointerX = e.clientX;
                    initialPointerY = e.clientY;
                    initialStickerSize = config.value.stickerSize;

                    window.addEventListener('pointermove', doResize);
                    window.addEventListener('pointerup', stopResize);
                };

                const doResize = (e) => {
                    if (!isManipulating.value) return;

                    const dx = e.clientX - initialPointerX;
                    const dy = e.clientY - initialPointerY;

                    // Use the larger absolute change to determine dominant resize direction
                    const delta = Math.abs(dx) > Math.abs(dy) ? dx : dy;

                    const newSize = clampSize(initialStickerSize + delta);
                    config.value.stickerSize = newSize;
                };

                const stopResize = () => {
                    isManipulating.value = false;
                    window.removeEventListener('pointermove', doResize);
                    window.removeEventListener('pointerup', stopResize);
                    saveDataOnly();
                };

                const setMode = (m) => {
                    mode.value = m;
                    localStorage.setItem('menu_mode', m);
                };

                const openQuickModal = () => { showQuickModal.value = true; };
                const closeQuickModal = () => {
                    showQuickModal.value = false;
                    saveDataOnly();
                };

                const saveDataOnly = (showAlert = false) => {
                    config.value.stickerSize = clampSize(config.value.stickerSize);
                    const plain = JSON.parse(JSON.stringify(config.value));
                    try {
                        localStorage.setItem('menu_data', JSON.stringify(plain));
                    } catch (err) {
                        alert('이미지 용량이 커서 저장에 실패했습니다. 용량이 작은 이미지(JPG/PNG)를 이용해주세요.');
                        return false;
                    }
                    if (syncConfig.value.dbUrl) {
                        fetch(`${syncConfig.value.dbUrl}/menus/${syncConfig.value.roomId}.json`, {
                            method: 'PUT',
                            body: JSON.stringify(plain)
                        }).then(() => {
                            if (showAlert) alert('클라우드 및 로컬에 저장되었습니다!');
                        }).catch(() => {
                            if (showAlert) alert('로컬에만 저장되었습니다 (클라우드 오류).');
                        });
                    } else if (showAlert) {
                        alert('로컬에 저장되었습니다!');
                    }
                    return true;
                };

                const copyShareLink = () => {
                    const url = new URL(window.location.href);
                    url.searchParams.set('db', syncConfig.value.dbUrl);
                    url.searchParams.set('room', syncConfig.value.roomId);
                    navigator.clipboard.writeText(url.toString()).then(() => alert('공유 링크가 복사되었습니다!'));
                };

                const handleFileChange = async (e, type) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        let dataURL = event.target.result;
                        // Compress image to prevent localStorage/Network quota issues
                        // background: 1920x1080 (max 300KB suggested), sticker: 800x800 (max 100KB suggested)
                        const maxWidth = type === 'bgImage' ? 1920 : 800;
                        const maxHeight = type === 'bgImage' ? 1080 : 800;
                        const quality = 0.6; // Higher compression

                        try {
                            const compressed = await compressImage(dataURL, maxWidth, maxHeight, quality, file.type);
                            config.value[type] = compressed;
                            saveDataOnly();
                        } catch (err) {
                            console.error('Compression failed', err);
                            config.value[type] = dataURL; // Fallback
                            saveDataOnly();
                        }
                    };
                    reader.readAsDataURL(file);
                };

                const clearImage = (type) => {
                    if (confirm('정말로 이미지를 삭제하시겠습니까?')) {
                        config.value[type] = '';
                        saveDataOnly();
                    }
                };

                const addItem = (catIdx) => {
                    config.value.categories[catIdx].items.push({name: '새 메뉴', engName: 'NEW MENU', enabled: true});
                };

                const removeItem = (catIdx, itemIdx) => {
                    if (confirm('이 메뉴를 삭제하시겠습니까?')) {
                        config.value.categories[catIdx].items.splice(itemIdx, 1);
                    }
                };

                const initSync = () => {
                    if (!syncConfig.value.dbUrl) {
                        console.log("initSync: No dbUrl configured");
                        return;
                    }
                    const url = `${syncConfig.value.dbUrl}/menus/${syncConfig.value.roomId}.json`;
                    console.log("initSync started with URL:", url);

                    // 1. 초기 데이터 한 번 가져오기
                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            console.log("Initial fetch result from DB:", data);
                            if (data) {
                                config.value = normalizeConfig(data);
                                syncStatus.value.connected = true;
                            }
                        })
                        .catch(err => console.error("Initial fetch error:", err));

                    // 2. 주기적 폴링 (2초마다 동기화 확인)
                    setInterval(async () => {
                        try {
                            const res = await fetch(url);
                            const data = await res.json();
                            if (data) {
                                const currentStr = JSON.stringify(config.value);
                                const newStr = JSON.stringify(normalizeConfig(data));
                                if (currentStr !== newStr) {
                                    console.log("Sync detected remote update, updating view...");
                                    config.value = normalizeConfig(data);
                                }
                                syncStatus.value.connected = true;
                            }
                        } catch (e) {
                            console.error("Polling sync error:", e);
                            syncStatus.value.connected = false;
                        }
                    }, 2000);
                };

                onMounted(() => {
                    console.log("App Mounted - Checking Config:", config.value);
                    console.log("BgImage exists?", !!config.value.bgImage, "Length:", config.value.bgImage ? config.value.bgImage.length : 0);

                    const params = new URLSearchParams(window.location.search);
                    if (params.has('db')) {
                        syncConfig.value.dbUrl = params.get('db');
                        syncConfig.value.roomId = params.get('room') || 'default';
                        localStorage.setItem('menu_sync_config', JSON.stringify(syncConfig.value));
                    }

                    if (syncConfig.value.dbUrl) {
                        console.log("Initializing sync with:", syncConfig.value.dbUrl);
                        initSync();
                    } else {
                        console.log("No DB URL configured, skipping sync.");
                    }
                });

                return {
                    MIN_STICKER_SIZE, MAX_STICKER_SIZE, mode, config, isManipulating, activeTab, showQuickModal,
                    stickerStyle, setMode, openQuickModal, closeQuickModal, saveDataOnly, copyShareLink,
                    syncConfig, syncStatus, handleFileChange, clearImage, addItem, removeItem,
                    startDrag, startResize
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
